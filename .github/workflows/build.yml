name: Build JUKEN AI TUNER APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Buat Struktur Proyek
        run: |
          mkdir -p app/src/main/java/com/juken/aituner
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "JukenAiTuner"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.juken.aituner"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.juken.aituner"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.ui:ui:1.5.4")
              implementation("androidx.compose.ui:ui-graphics:1.5.4")
              implementation("androidx.compose.material3:material3:1.1.2")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="JUKEN AI TUNER"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/juken/aituner/MainActivity.kt
          package com.juken.aituner
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.*
          import kotlinx.coroutines.delay

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      var tab by remember { mutableStateOf(0) }
                      var rpm by remember { mutableStateOf(2000) }
                      var tps by remember { mutableStateOf(15f) }
                      var afr by remember { mutableStateOf(13.6f) }
                      val grid = remember { mutableStateListOf(14.0f, 18.0f, 22.0f, 28.0f, 34.0f, 40.0f) }
                      LaunchedEffect(Unit) {
                          while(true) {
                              rpm = if(rpm >= 8500) 1800 else rpm + 350
                              tps = ((rpm - 1800) / 70f).coerceIn(0f, 100f)
                              val raw = 12.8f + if(rpm > 4500) 0.8f else -0.4f
                              afr = ((raw * 10).toInt() / 10f)
                              delay(400)
                          }
                      }
                      Surface(Modifier.fillMaxSize(), color = Color(0xFF090D16)) {
                          Column(Modifier.padding(16.dp)) {
                              Text("JUKEN AI TUNER", color = Color(0xFF00E5FF), fontSize = 20.sp)
                              Row(Modifier.padding(vertical = 12.dp)) {
                                  Button(onClick = { tab = 0 }, Modifier.weight(1f)) { Text("Monitor") }
                                  Spacer(Modifier.width(8.dp))
                                  Button(onClick = { tab = 1 }, Modifier.weight(1f)) { Text("Fuel Map") }
                              }
                              if(tab == 0) {
                                  Text("RPM: $rpm", color = Color(0xFF00E5FF), fontSize = 28.sp)
                                  Text("TPS: ${tps.toInt()}%", color = Color(0xFF00E676), fontSize = 28.sp)
                                  Text("AFR: $afr (Target: 12.8)", color = Color(0xFFFFAB00), fontSize = 24.sp)
                                  Spacer(Modifier.height(10.dp))
                                  Text("Status: Mode Simulasi Aman Aktif", color = Color.Gray, fontSize = 13.sp)
                              } else {
                                  Text("Fuel Map (Klik sel untuk Koreksi AFR AI):", color = Color.White)
                                  Spacer(Modifier.height(8.dp))
                                  grid.forEachIndexed { i, v ->
                                      Button(onClick = {
                                          val c = ((afr / 12.8f - 1f) * 100f).coerceIn(-10f, 10f)
                                          grid[i] = ((v * (1f + c / 100f)) * 10).toInt() / 10f
                                      }, Modifier.fillMaxWidth().padding(vertical = 3.dp)) {
                                          Text("Sel #$i: $v (Koreksi AFR)")
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Rakit Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Simpan APK Siap Download
        uses: actions/upload-artifact@v4
        with:
          name: JUKEN-AI-TUNER-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
